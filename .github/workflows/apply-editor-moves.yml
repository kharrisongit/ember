name: Apply editor changes
run-name: Editor moves ${{ inputs.submission_id }}
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission identifier
        required: true
        type: string
      draft:
        description: Structured editor data from the game or private sender
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: editor-submissions
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, check and publish the submitted edits
        run: |
          git config user.name 'Emberfell Editor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/publish-editor-moves.mjs
  deploy:
    needs: apply
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # GITHUB_TOKEN pushes do not trigger the normal Pages push workflow.
      - name: Stamp the game version
        run: node tools/editor-source-version.mjs --stamp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Publish the updated game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
