name: Apply editor changes
run-name: Editor moves ${{ inputs.submission_id }}
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission identifier
        required: true
        type: string
      draft:
        description: Structured editor data from the game or private sender
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and apply the submitted edits
        run: node tools/apply-editor-moves.mjs
      - name: Check game and editor behavior
        run: |
          node tools/check-game-scripts.mjs
          node tests/npc-placement.mjs
          node tests/hunting-grounds.mjs
          node tests/animal-sprites.mjs
          node tests/overworld-return.mjs
          node tests/temple-exit-triggers.mjs
          node tests/temple-arenas.mjs
          node tests/temple-compass.mjs
      - name: Commit the validated layout
        run: |
          git config user.name 'Emberfell Editor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/editor-layouts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply edits submitted from the game'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger the normal Pages push workflow.
      - name: Stamp the game version
        run: node tools/editor-source-version.mjs --stamp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Publish the updated game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
