# The one-time legacy source split is complete. Validate the maintained scripts
# instead of regenerating them from the obsolete js/game 2.js snapshot.
name: Validate game scripts
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'assets/interiors/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/editor-layouts.json'
      - '.github/workflows/split-game.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'assets/interiors/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/editor-layouts.json'
      - '.github/workflows/split-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the scripts loaded by the game
        run: node tools/check-game-scripts.mjs
      - name: Check temple travel and combat
        run: |
          node tests/town-music.mjs
          node tests/dragon-dialogue.mjs
          node tests/npc-callouts-facing.mjs
          node tests/temple-exit-triggers.mjs
          node tests/temple-arenas.mjs
          node tests/temple-compass.mjs
          node tests/npc-placement.mjs
          node tests/editor-source-compatibility.mjs
          node tests/editor-publish-race.mjs
          node tests/hunting-grounds.mjs
          node tests/arena-number-tool.mjs
          node tests/animal-sprites.mjs
          node tests/overworld-return.mjs
          node tests/overworld-published-return.cjs
          node tests/dock-loading.mjs
          node tests/mountain-passage.mjs
          node tests/boss-pressure.mjs
          node tests/ferry-companion.mjs
          node tests/village-markets.mjs
          node tests/tavern-layering.mjs
          node tests/library-layering.mjs
