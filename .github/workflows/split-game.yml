# The one-time legacy source split is complete. Validate the maintained scripts
# instead of regenerating them from the obsolete js/game 2.js snapshot.
name: Validate game scripts
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'assets/interiors/**'
      - 'assets/dialogue/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/editor-layouts.json'
      - '.github/workflows/split-game.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'assets/interiors/**'
      - 'assets/dialogue/**'
      - 'tests/**'
      - 'tools/**'
      - 'assets/editor-layouts.json'
      - '.github/workflows/split-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the scripts loaded by the game
        run: node tools/check-game-scripts.mjs
      - name: Check startup and retained overworld performance
        run: |
          node tests/startup-loading.mjs
          node tests/startup-assets.mjs
          node tests/boot-progress.mjs
          node tests/world-layout.mjs
          node tests/overworld-return.mjs
          node tests/loading-world.mjs
      - name: Check the pyramid and Spider Queen
        run: |
          npm install --no-save --package-lock=false @napi-rs/canvas@0.1.100 pngjs@7.0.0
          node tests/spider-queen-demo.mjs
          node tests/spider-queen-web.mjs
          node tests/spider-queen-boss.mjs
          node tests/desert-pyramid.mjs
          node tests/desert-adventure.mjs
          node tests/side-route-adventures.mjs
      - name: Check temple travel and combat
        run: |
          node tests/arena-entry.mjs
          node tests/arena-entry-lifecycle.mjs
          node tests/arena-awareness-world.mjs
          node tests/sword-tutorial.mjs
