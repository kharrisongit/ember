name: Split game source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split game 2 into manageable classic scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('js/game 2.js').read_text()
          media=[]
          specs=[
            ('kingDragonDeathImg.src','kingDragonDeathSrc'),
            ('greenSceneSource.src','greenSceneSourceSrc'),
            ('faintDragonImg.src','faintDragonSrc'),
            ('throneRoomImg.src','throneRoomSrc'),
          ]
          for lhs,key in specs:
            pat=re.compile(r'^'+re.escape(lhs)+r'\s*=\s*(.+);\s*$',re.M)
            m=pat.search(src)
            if not m: raise SystemExit('missing media assignment '+lhs)
            expr=m.group(1)
            # The media expressions are string literals, sometimes joined with +.
            pieces=re.findall(r'"([^"]*)"',expr)
            value=''.join(pieces)
            media.append((key,value))
            src=src[:m.start()]+lhs+' = window.EMBER_MEDIA.'+key+';'+src[m.end():]
          # Split media strings into <= ~500 KB scripts.
          out=Path('js/generated');out.mkdir(parents=True,exist_ok=True)
          for p in out.glob('game-part-*.js'): p.unlink()
          for p in out.glob('media-*.js'): p.unlink()
          mi=1
          for key,value in media:
            chunks=[value[i:i+480000] for i in range(0,len(value),480000)]
            for j,ch in enumerate(chunks):
              lines=['window.EMBER_MEDIA=window.EMBER_MEDIA||{};']
              if j==0: lines.append('window.__EM_'+key+'='+repr(ch)+';')
              else: lines.append('window.__EM_'+key+'+='+repr(ch)+';')
              if j==len(chunks)-1:
                lines.append('window.EMBER_MEDIA.'+key+'=window.__EM_'+key+';delete window.__EM_'+key+';')
              (out/f'media-{mi}.js').write_text('\n'.join(lines)+'\n')
              mi+=1
          # Split executable source only at top-level function declarations.
          # Split only at explicit stable section markers. Function declarations are hoisted
          # only within one classic script; splitting callers from later declarations breaks boot.
          marker='/* === SPLIT_SAFE_BOUNDARY === */'
          starts=[m.start() for m in re.finditer(re.escape(marker),src)]
          cuts=[0];target=650000;pos=0
          while len(src)-pos>850000:
            choices=[x for x in starts if pos+350000<=x<=pos+850000]
            if not choices: raise SystemExit('no safe split boundary near '+str(pos))
            cut=min(choices,key=lambda x:abs(x-(pos+target)))
            cuts.append(cut);pos=cut
          cuts.append(len(src))
          parts=[src[cuts[i]:cuts[i+1]] for i in range(len(cuts)-1)]
          for i,part in enumerate(parts,1):(out/f'game-part-{i}.js').write_text(part)
          # Rewrite index loader, keeping old game.js in repo as rollback.
          index=Path('index.html').read_text()
          old=re.compile(r'<script src="js/game\.js"\s*\n\s*onload="[^"]*"\s*\n\s*onerror="[^"]*"></script>')
          tags=[]
          for i in range(1,mi): tags.append(f'<script src="js/generated/media-{i}.js"></script>')
          for i in range(1,len(parts)+1):
            err=' onerror="(document.getElementById(\'bootMsg\')||document.getElementById(\'bootmsg\')).textContent=\'GAME PART '+str(i)+' LOAD ERROR\'"'
            tags.append(f'<script src="js/generated/game-part-{i}.js"{err}></script>')
          index,n=old.subn('\n'.join(tags),index,count=1)
          if n!=1:
            # Repo may already use generated split tags. Replace that block in-place.
            generated=re.compile(r'(?:<script src="js/generated/(?:media|game-part)-[^"]+\.js"[^>]*></script>\s*)+')
            index,n=generated.subn('\n'.join(tags)+'\n',index,count=1)
          if n!=1: raise SystemExit('neither game.js nor generated loader block found')
          Path('index.html').write_text(index)
          print('media files',mi-1,'game parts',len(parts),'sizes',[len(x) for x in parts])
          PY
          for f in js/generated/*.js; do node --check "$f"; done
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/generated
          git commit -m "Split oversized game source into manageable scripts"
          git push
